name: conformance

on:
  push:
    branches: [main]
    paths:
      - "public/v0.1/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "astro.config.mjs"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "public/v0.1/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "astro.config.mjs"
      - ".github/workflows/conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Check the pinned Node version satisfies every engines.node in the lockfile
        run: npm run node-floor

      - name: Run Clearance Manifest v0.1 conformance check
        run: npm run conformance

      - name: Build the openclearance.org site
        run: npm run build
