name: conformance

on:
  push:
    branches: [main]
    paths:
      - "public/v0.1/**"
      - "public/v0.2/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "public/v0.1/**"
      - "public/v0.2/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - ".github/workflows/conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      # The harness finishes in seconds. The limit turns a hang (a parser loop
      # that never ends, say) into a prompt failure instead of a six-hour wait.
      - name: Run Clearance Manifest conformance check (v0.1 and v0.2)
        timeout-minutes: 2
        run: npm run conformance

      - name: Build the openclearance.org site
        run: npm run build
