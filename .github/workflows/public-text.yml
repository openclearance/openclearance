name: public-text

# Identity and trailer rules for PRs opened by the maintainer account or by
# Dependabot (see CONTRIBUTING.md, "Commit identity and messages"). Runs on
# every PR, with no path filter: a commit message or a PR description can need
# checking whatever files the PR touches. `edited` re-runs it when the
# description changes.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  public-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Self-test the check
        run: node scripts/check-public-text.mjs --self-test

      # PR fields reach the script only through the environment, never as
      # interpolated command text.
      - name: Check commit identities, commit messages and the PR description
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-public-text.mjs
