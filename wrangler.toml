# Cloudflare Pages project for openclearance.org (static Astro build).
# Deployed manually with `npm run deploy` (astro build, then `wrangler pages
# deploy`) under the operator's local `wrangler login`. This public repository
# holds no Cloudflare token and no CI deploy workflow; see CONTRIBUTING.md.
# `pages_build_output_dir` lets `wrangler pages deploy` find the build without
# extra flags.
name = "openclearance"
pages_build_output_dir = "dist"
